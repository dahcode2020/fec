services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: emrys
      POSTGRES_USER: emrys
      POSTGRES_PASSWORD: emrys_dev_password
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 crée un sous-dossier par version sous ce point de montage.
      - emrys-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emrys -d emrys"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    environment:
      DATABASE_URL: postgresql://emrys:emrys_dev_password@postgres:5432/emrys
      DATABASE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  emrys-postgres-data:
