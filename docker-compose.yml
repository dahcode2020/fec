services:
  # L’environnement par défaut utilise la base centrale Neon configurée dans .env.
  # Le PostgreSQL local optionnel se trouve dans docker-compose.local.yml.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      PORT: "${PORT:-8080}"
      HOST: "${HOST:-0.0.0.0}"
      DATABASE_URL: "${DATABASE_URL:-}"
      DATABASE_SSL: "${DATABASE_SSL:-true}"
      EMRYS_PUBLIC_URL: "${EMRYS_PUBLIC_URL:-http://localhost:4174}"
      DEV_EXPOSE_TOKENS: "${DEV_EXPOSE_TOKENS:-true}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:4174}"
    ports:
      - "8080:8080"
